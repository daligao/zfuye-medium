name: Medium精品文章自动发布

on:
  schedule:
    # 5篇全集中在北京凌晨0-6点（UTC 16-22），DeepSeek低峰优惠时段
    - cron: '0 16 * * *'   # 北京 00:00
    - cron: '10 17 * * *'  # 北京 01:10
    - cron: '20 18 * * *'  # 北京 02:20
    - cron: '30 19 * * *'  # 北京 03:30
    - cron: '40 20 * * *'  # 北京 04:40
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Publish article
        env:
          DEEPSEEK_KEY:  ${{ secrets.DEEPSEEK_KEY }}
          ALIYUN_KEY:    ${{ secrets.ALIYUN_KEY }}
          WP_USER:       ${{ secrets.WP_USER }}
          WP_APP_PASS:   ${{ secrets.WP_APP_PASS }}
          WEBSHARE_USER: ${{ secrets.WEBSHARE_USER }}
          WEBSHARE_PASS: ${{ secrets.WEBSHARE_PASS }}
        run: python publisher.py

      - name: Save log
        run: |
          git config user.name "daligao"
          git config user.email "daligao@users.noreply.github.com"
          git add data/log.json
          git diff --staged --quiet || git commit -m "log: $(date +%Y-%m-%d\ %H:%M)"
          git pull --rebase origin main
          git push
